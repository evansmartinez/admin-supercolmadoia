<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Colmado IA - Dashboard V2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.3);
            --primary-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        body {
            background: #f0f2f5;
            background-image: radial-gradient(at 0% 0%, rgba(30, 60, 114, 0.05) 0, transparent 50%), 
                              radial-gradient(at 50% 0%, rgba(42, 82, 152, 0.05) 0, transparent 50%);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #1e293b;
            min-height: 100vh;
        }

        .bento-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            padding: 1rem;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            padding: 1.5rem;
            transition: transform 0.2s ease;
            height: 100%;
        }

        .glass-card:hover {
            transform: translateY(-5px);
        }

        .header-section {
            background: var(--primary-gradient);
            color: white;
            padding: 3rem 2rem 4rem 2rem;
            border-radius: 0 0 40px 40px;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stock-high { background: #dcfce7; color: #166534; }
        .stock-low { background: #fee2e2; color: #991b1b; }

        .price-tag {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2563eb;
        }

        .sync-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .sync-btn:hover {
            background: white;
            color: #1e3c72;
        }

        .search-container {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            z-index: 10;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem 1rem 3rem;
            border-radius: 20px;
            border: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            font-size: 1.1rem;
            outline: none;
            transition: box-shadow 0.3s ease;
        }

        .search-input:focus {
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1.2rem;
        }

        #loader-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(240, 242, 245, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* Estilos para el Modal */
        .modal-content {
            border-radius: 20px;
            border: none;
        }
        .modal-header {
            background: var(--primary-gradient);
            color: white;
            border-radius: 20px 20px 0 0;
            border-bottom: none;
        }
        .modal-header .btn-close {
            filter: invert(1) grayscale(100%) brightness(200%);
        }
        .detail-row {
            border-bottom: 1px solid #e2e8f0;
            padding: 10px 0;
        }
        .detail-row:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div id="loader-overlay" class="d-none">
        <div class="text-center">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-3 fw-bold">Sincronizando inventario...</p>
        </div>
    </div>

    <header class="header-section text-center">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
                <div class="text-start">
                    <h1 class="display-5 fw-bold m-0">Super Colmado IA</h1>
                    <p class="opacity-75 m-0">Gestión de Inventario Inteligente</p>
                </div>
                <button onclick="fetchInventario()" class="sync-btn">
                    <i class="bi bi-arrow-repeat me-2"></i>Sincronizar Ahora
                </button>
            </div>
        </div>
        
        <div class="search-container">
            <i class="bi bi-search search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Buscar por producto o ID..." onkeyup="filtrarProductos()">
        </div>
    </header>

    <main class="container mb-5 mt-5">
        <div id="bento-grid" class="bento-container">
            </div>

        <div id="empty-state" class="text-center py-5 d-none">
            <i class="bi bi-box-seam display-1 text-muted"></i>
            <h3 class="mt-3">No se encontraron productos</h3>
            <p class="text-muted">Verifica la conexión con el Data Store en Make.</p>
        </div>

        <div id="no-search-results" class="text-center py-5 d-none">
            <i class="bi bi-search display-1 text-muted"></i>
            <h3 class="mt-3">Sin resultados</h3>
            <p class="text-muted">No hay productos que coincidan con tu búsqueda.</p>
        </div>
    </main>

    <div class="modal fade" id="detalleModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header p-4">
                    <h5 class="modal-title fw-bold" id="modalTitulo">Detalle del Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4" id="modalCuerpo">
                    </div>
                <div class="modal-footer bg-light border-0 rounded-bottom-4">
                    <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Variable global para almacenar los datos descargados y usarlos en el botón de detalles
        let inventarioGlobal = [];

        async function fetchInventario() {
            const url = 'https://hook.us2.make.com/pu7hgbl8my85yt17b5aqczhz59758ncy';
            const grid = document.getElementById('bento-grid');
            const loader = document.getElementById('loader-overlay');
            const emptyState = document.getElementById('empty-state');
            const searchInput = document.getElementById('searchInput');

            loader.classList.remove('d-none');
            grid.innerHTML = '';
            emptyState.classList.add('d-none');
            document.getElementById('no-search-results').classList.add('d-none');
            searchInput.value = ''; 

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (!data || data.length === 0) {
                    emptyState.classList.remove('d-none');
                    return;
                }

                // Guardamos los datos globalmente para acceder a ellos al hacer clic en "Ver detalles"
                inventarioGlobal = data;

                data.forEach((item, index) => {
                    const id = item.ID_PRODUCTO || item.Key || "---";
                    const nombre = item.NOMBRE_PRODUCTO || "Producto sin nombre";
                    const precio = item.PRECIO || 0;
                    
                    let stockActual = 0;
                    if (item.STOCK !== undefined) stockActual = item.STOCK;
                    else if (item.stock !== undefined) stockActual = item.stock;

                    const isLow = stockActual <= 5;
                    const stockClass = isLow ? 'stock-low' : 'stock-high';
                    const stockIcon = isLow ? 'bi-exclamation-triangle' : 'bi-check-circle';

                    const card = `
                        <div class="producto-item">
                            <div class="glass-card d-flex flex-column justify-content-between">
                                <div>
                                    <div class="d-flex justify-content-between align-items-start mb-3">
                                        <span class="badge bg-dark-subtle text-dark border-0 rounded-pill px-3 py-2 product-id" style="font-size: 0.7rem;">
                                            ID: ${id}
                                        </span>
                                        <div class="status-badge ${stockClass}">
                                            <i class="bi ${stockIcon}"></i>
                                            ${stockActual} uds.
                                        </div>
                                    </div>
                                    <h4 class="fw-bold mb-1 product-name">${nombre}</h4>
                                    <p class="text-muted small mb-3">Disponibilidad en almacén real</p>
                                </div>
                                
                                <div class="d-flex justify-content-between align-items-center mt-4">
                                    <div class="price-tag">RD$ ${precio}</div>
                                    <button onclick="abrirDetalle(${index})" class="btn btn-sm btn-outline-primary rounded-pill px-3">
                                        Ver detalles
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    grid.innerHTML += card;
                });

            } catch (error) {
                console.error("Error de sincronización:", error);
                alert("Error al conectar con Make. Por favor revisa que el escenario esté activo.");
            } finally {
                loader.classList.add('d-none');
            }
        }

        // Función para abrir el Modal y llenar los datos
        function abrirDetalle(index) {
            const producto = inventarioGlobal[index];
            
            // Asignamos el título
            document.getElementById('modalTitulo').innerText = producto.NOMBRE_PRODUCTO || "Detalle de Producto";
            
            // Construimos una lista con todas las propiedades que vengan en el JSON
            let htmlDetalles = '<div class="d-flex flex-column">';
            
            for (const [clave, valor] of Object.entries(producto)) {
                // Formateamos un poco la clave para que se vea bonita (quitar guiones bajos)
                const claveFormateada = clave.replace(/_/g, ' ');
                htmlDetalles += `
                    <div class="detail-row d-flex justify-content-between align-items-center">
                        <span class="text-muted text-capitalize fw-semibold" style="font-size: 0.85rem;">${claveFormateada}</span>
                        <span class="fw-bold text-dark text-end">${valor !== null && valor !== "" ? valor : "-"}</span>
                    </div>
                `;
            }
            htmlDetalles += '</div>';
            
            // Inyectamos el HTML y mostramos el modal
            document.getElementById('modalCuerpo').innerHTML = htmlDetalles;
            const myModal = new bootstrap.Modal(document.getElementById('detalleModal'));
            myModal.show();
        }

        function filtrarProductos() {
            const input = document.getElementById('searchInput');
            const filtro = input.value.toUpperCase();
            const grid = document.getElementById('bento-grid');
            const productos = grid.getElementsByClassName('producto-item');
            const noResults = document.getElementById('no-search-results');
            
            let productosVisibles = 0;

            for (let i = 0; i < productos.length; i++) {
                const nombre = productos[i].querySelector('.product-name').textContent || productos[i].querySelector('.product-name').innerText;
                const id = productos[i].querySelector('.product-id').textContent || productos[i].querySelector('.product-id').innerText;
                
                if (nombre.toUpperCase().indexOf(filtro) > -1 || id.toUpperCase().indexOf(filtro) > -1) {
                    productos[i].style.display = "";
                    productosVisibles++;
                } else {
                    productos[i].style.display = "none";
                }
            }

            if (productosVisibles === 0 && productos.length > 0) {
                noResults.classList.remove('d-none');
            } else {
                noResults.classList.add('d-none');
            }
        }

        window.onload = fetchInventario;
    </script>
</body>
</html>
