<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Super Colmado IA</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      padding: 25px;
      max-width: 1200px;
      margin: auto;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin: 0 0 10px;
      color: #555;
    }

    .card .value {
      font-size: 28px;
      font-weight: bold;
      color: #16a34a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #111827;
      color: white;
    }

    tr:hover {
      background: #f1f5f9;
    }
  </style>
</head>
<body>

<header>
  <h1>📊 Dashboard Super Colmado IA</h1>
  <p>Ventas, productos y reportes</p>
</header>

<div class="container">

  <div class="cards">
    <div class="card">
      <h3>Total vendido</h3>
      <div class="value" id="totalVendido">RD$0.00</div>
    </div>

    <div class="card">
      <h3>Total productos vendidos</h3>
      <div class="value" id="productosVendidos">0</div>
    </div>

    <div class="card">
      <h3>Total pedidos</h3>
      <div class="value" id="totalPedidos">0</div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Pedido</th>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Subtotal</th>
        <th>Método</th>
        <th>Dirección</th>
      </tr>
    </thead>
    <tbody id="tablaVentas">
      <tr>
        <td colspan="7">Cargando ventas...</td>
      </tr>
    </tbody>
  </table>

</div>

<script>
  async function cargarVentas() {
    try {
      const res = await fetch("/api/ventas");
      const ventas = await res.json();

      let totalVendido = 0;
      let productosVendidos = 0;
      const pedidos = new Set();

      const tabla = document.getElementById("tablaVentas");
      tabla.innerHTML = "";

      ventas.forEach(v => {
        const subtotal = Number(v.SUBTOTAL || 0);
        const cantidad = Number(v.CANTIDAD || 0);

        totalVendido += subtotal;
        productosVendidos += cantidad;

        if (v.PEDIDO_ID) pedidos.add(v.PEDIDO_ID);

        tabla.innerHTML += `
          <tr>
            <td>${v.FECHA || ""}</td>
            <td>${v.PEDIDO_ID || ""}</td>
            <td>${v.PRODUCTO || ""}</td>
            <td>${v.CANTIDAD || ""}</td>
            <td>RD$${subtotal.toLocaleString("en-US", { minimumFractionDigits: 2 })}</td>
            <td>${v.METODO_PAGO || ""}</td>
            <td>${v.DIRECCION || ""}</td>
          </tr>
        `;
      });

      document.getElementById("totalVendido").innerText =
        "RD$" + totalVendido.toLocaleString("en-US", { minimumFractionDigits: 2 });

      document.getElementById("productosVendidos").innerText = productosVendidos;
      document.getElementById("totalPedidos").innerText = pedidos.size;

    } catch (error) {
      document.getElementById("tablaVentas").innerHTML =
        `<tr><td colspan="7">Error cargando ventas</td></tr>`;
      console.error(error);
    }
  }

  cargarVentas();
</script>

</body>
</html>
